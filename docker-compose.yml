services:
  # 1. FertiFlow Core Backend (FastAPI + APScheduler)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fertiflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - N8N_ENABLED=true
      - N8N_OUTBOUND_WEBHOOK_URL=http://n8n:5678/webhook/fertiflow-outbound
      - N8N_DOCTOR_ALERT_WEBHOOK_URL=http://n8n:5678/webhook/fertiflow-doctor-alert
    networks:
      - fertiflow-network

  # 2. n8n Workflow Automation & Messaging Gateway
  n8n:
    image: n8nio/n8n:latest
    container_name: fertiflow-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - fertiflow-network

  # 3. FertiFlow Clinical Dashboard (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api/v1
    container_name: fertiflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fertiflow-network

networks:
  fertiflow-network:
    driver: bridge

volumes:
  n8n_data:
